<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishal Enterprise | Catalog Page Template</title>
    <style>
        :root {
            --primary-lime: #9EC037;
            --text-dark: #333333;
            --text-muted: #666666;
            --bg-light: #F9F9F9;
            --table-header-bg: #EAEAEA;
            --table-stripe: #F5F5F5;
            --table-dark-row: #05283F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: var(--text-dark);
            background-color: #d0d0d0;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .catalog-page {
            width: 1200px;
            height: 600px;
            background-color: #ffffff;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            overflow: hidden;
        }

        .page-left {
            width: 50%;
            height: 100%;
            padding: 40px 40px 30px 50px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .header-left h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-lime);
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .header-left h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .best-seller-badge {
            position: absolute;
            left: 0;
            top: 140px;
            background-color: #9EC037;
            color: white;
            padding: 6px 10px 6px 15px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.1;
            clip-path: polygon(0 0, 100% 0, 85% 50%, 100% 100%, 0 100%);
        }

        .main-product-image {
            width: 100%;
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page-right {
            width: 50%;
            height: 100%;
            padding: 45px 50px 30px 40px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="catalog-page">
        <div class="page-left">
            <div class="header-left">
                <h1>INDUSTRIAL PALLET SPECIFICATION</h1>
                <h2>1200 X 1000 mm</h2>
            </div>
            <div class="best-seller-badge">Best Seller</div>
            <div class="main-product-image">
                <div style="width: 380px; height: 230px; background: #e5e5e5; display: flex; align-items: center; justify-content: center; color: #888; border-radius: 8px;">
                    <span>[ Product Spec Image ]</span>
                </div>
            </div>
        </div>
        <div class="page-right">
            <h2>Specifications</h2>
            <p>High quality recycled plastic product catalog layout template.</p>
        </div>
    </div>
</body>
</html>
