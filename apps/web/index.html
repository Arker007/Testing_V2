<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary meta -->
  <title>Vishal Enterprise - Industrial Recycled Plastic Solutions</title>
  <meta name="description"
    content="Industrial recycled plastic pallets, lumber, and circular manufacturing solutions with unified design tokens." />
  <meta name="theme-color" content="#9EC037" />
  <meta name="robots" content="index, follow" />

  <!-- Theme Initialization Script (Prevents FOUC) -->
  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('theme');
        var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = storedTheme === 'dark' || (!storedTheme && systemPrefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Open Graph (improves social-share + perceived trust) -->
  <link rel="canonical" href="https://vishalenterprise.com" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="VISHAL ENTERPRISE | Recycled Plastic Manufacturer India" />
  <meta property="og:description"
    content="India's leading manufacturer of recycled plastic pallets, HDPE granules, plastic lumber & industrial containers. ISO 9001:2015 certified. B2B bulk supply." />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:site_name" content="VISHAL ENTERPRISE" />
  <meta property="og:url" content="https://vishalenterprise.com" />
  <meta property="og:image" content="https://vishalenterprise.com/og-image.jpg" />

  <!-- DNS prefetch for external origins -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

  <!-- Preconnect for origins we open sockets to -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Google Fonts — non-blocking -->
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
    as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap">
  </noscript>
</head>

<body>
  <div id="root"></div>
  <!-- Kick off API fetches immediately, before React bundle even loads -->
  <script>
    window.__prefetch = {
      products: fetch('/api/products').then(r => r.json()).catch(() => null),
      categories: fetch('/api/categories').then(r => r.json()).catch(() => null),
      company: fetch('/api/company').then(r => r.json()).catch(() => null),
      content: fetch('/api/content').then(r => r.json()).catch(() => null),
    };
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
